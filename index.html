<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Gastos</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- ── Pantalla de login ── -->
  <div id="pantalla-login">
    <div class="login-card">
      <h1>Control de Gastos</h1>
      <p>Inicia sesión para acceder a tu control de tarjetas y créditos</p>
      <button id="btn-login" class="btn-google">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#FFC107" d="M43.6 20H24v8h11.3C33.7 33.1 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34.1 6.5 29.3 4.5 24 4.5 12.7 4.5 3.5 13.7 3.5 25S12.7 45.5 24 45.5c11.1 0 20.5-8 20.5-20.5 0-1.4-.1-2.7-.4-4z"/>
          <path fill="#FF3D00" d="M6.3 15.5l6.6 4.8C14.6 16 19 13 24 13c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34.1 6.5 29.3 4.5 24 4.5c-7.6 0-14.2 4.3-17.7 11z"/>
          <path fill="#4CAF50" d="M24 45.5c5.2 0 9.9-1.9 13.5-5l-6.2-5.2C29.3 37 26.8 38 24 38c-5.3 0-9.7-3-11.3-7.2l-6.5 5C9.8 41.2 16.4 45.5 24 45.5z"/>
          <path fill="#1976D2" d="M43.6 20H24v8h11.3c-.8 2.3-2.3 4.2-4.3 5.5l6.2 5.2C41.1 35.1 44.5 30.5 44.5 24.5c0-1.4-.1-2.7-.4-4z"/>
        </svg>
        Entrar con Google
      </button>
    </div>
  </div>

  <!-- ── App principal ── -->
  <div id="app" class="hidden">

    <header>
      <h1>Control de Gastos</h1>
      <div class="header-actions">
        <div class="usuario-info">
          <img id="usuario-foto" src="" alt="" class="hidden">
          <span id="usuario-nombre"></span>
        </div>
        <button id="btn-limpiar" class="btn-danger">Reiniciar</button>
        <button id="btn-columnas" class="btn-secondary">⚙ Columnas</button>
        <span id="btn-guardado" class="btn-guardado">✓ Guardado</span>
        <button id="btn-nuevo-periodo" class="btn-primary">+ Nuevo Período</button>
        <button id="btn-logout" class="btn-logout">Salir</button>
      </div>
    </header>

    <!-- Modal columnas -->
    <div id="modal-overlay" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-header">
          <h2>Gestionar Columnas</h2>
          <button id="modal-cerrar" class="modal-close">✕</button>
        </div>

        <div class="modal-body">
          <div class="col-seccion">
            <h3>Tarjetas de Crédito (TC)</h3>
            <ul id="lista-tc" class="lista-columnas"></ul>
          </div>
          <div class="col-seccion">
            <h3>Créditos (CR)</h3>
            <ul id="lista-cr" class="lista-columnas"></ul>
          </div>

          <div class="col-seccion col-agregar">
            <h3>Agregar nueva columna</h3>
            <div class="form-agregar">
              <input id="nueva-nombre" type="text" placeholder="Nombre (ej: Visa Gold)" maxlength="20">
              <select id="nueva-tipo">
                <option value="TC">Tarjeta de Crédito (TC)</option>
                <option value="CR">Crédito (CR)</option>
              </select>
              <button id="btn-agregar-col" class="btn-primary">Agregar</button>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button id="modal-cancelar" class="btn-secondary">Cancelar</button>
          <button id="modal-guardar" class="btn-primary">Guardar cambios</button>
        </div>
      </div>
    </div>

    <main>
      <div class="tabla-wrapper">
        <table id="tabla-gastos">
          <thead id="tabla-header"></thead>
          <tbody id="tabla-body"></tbody>
        </table>
      </div>
    </main>

  </div>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- App -->
  <script src="assets/js/data.js"></script>
  <script src="assets/js/firebase.js"></script>
  <script src="assets/js/dialogs.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth.js"></script>

</body>
</html>
